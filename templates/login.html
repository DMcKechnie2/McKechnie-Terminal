<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — McKechnie Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Declared so the browser renders its own furniture light too — autofill
     wash, the password reveal control, scrollbars. Left to the default they
     follow the OS and a dark-mode machine paints a dark autofill over a white
     card. */
  color-scheme: light;

  /* Every colour here is index.html's `body.light` block verbatim. That theme
     already exists and is the one you are handed off to, so choosing a second
     set of light values for this page would only invent a way for the two to
     drift — same argument as the radii below, in the other direction. */
  --bg: #f2f2ee;
  --surface: #ffffff;
  --surface2: #e9e9e4;
  --border: #d6d6ce;
  --grid: rgba(0,0,0,0.04);
  --accent: #007a33;
  --accent-hi: #00602a;   /* hover — on light this darkens, it does not fade */
  --on-accent: #fff;      /* text sitting on an accent fill */
  --text: #14141a;
  --muted: #63637d;       /* 4.8:1 on white */
  --danger: #c8102e;

  /* Same four steps as index.html — this page is where those values came
     from, so it states them the same way rather than repeating the numbers. */
  --r-sm:   4px;
  --r:      6px;
  --r-lg:   10px;
  --r-pill: 999px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 380px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 36px 32px 32px;
}

.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }

.logo-mark {
  width: 30px; height: 30px; flex: none;
  border: 2px solid var(--accent);
  border-radius: var(--r);
  position: relative;
}
.logo-mark::after {
  content: ''; position: absolute; inset: 6px;
  background: var(--accent); border-radius: var(--r-sm);
}

.title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
}
.subtitle {
  font-size: 10px; color: var(--muted);
  letter-spacing: 0.16em; text-transform: uppercase; margin-top: 2px;
}

label {
  display: block;
  font-size: 10px; font-weight: 600; color: var(--muted);
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-bottom: 7px;
}

input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  padding: 11px 13px;
  outline: none;
  transition: border-color .15s;
}
input:focus { border-color: var(--accent); }

.field { margin-bottom: 18px; }

button {
  width: 100%;
  background: var(--accent);
  color: var(--on-accent);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13.5px; font-weight: 700;
  letter-spacing: 0.02em;
  border: none; border-radius: var(--r);
  padding: 12px;
  cursor: pointer;
  transition: background .15s, opacity .15s;
}
button:hover:not(:disabled) { background: var(--accent-hi); }
button:disabled { opacity: .5; cursor: default; }

.error {
  display: none;
  background: rgba(200,16,46,0.10);
  border: 1px solid rgba(200,16,46,0.30);
  border-radius: var(--r);
  color: var(--danger);
  font-size: 12.5px;
  padding: 10px 12px;
  margin-bottom: 18px;
}

.foot {
  margin-top: 22px;
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
  text-align: center;
}

/* The guest door. Rendered only when the server says a guest account is
   enabled, so a visitor to a deployment without one sees the form above and
   nothing else. Secondary weight — it is the way in for someone *reviewing*
   the project, and the primary control stays the sign-in for whoever owns it. */
.or {
  display: flex; align-items: center; gap: 10px;
  margin: 18px 0 14px;
  font-size: 10px; color: var(--muted);
  letter-spacing: 0.12em; text-transform: uppercase;
}
.or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--border); }

button.guest {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
}
button.guest:hover:not(:disabled) { background: var(--surface2); border-color: var(--muted); }
.guest-note { margin-top: 8px; font-size: 11px; color: var(--muted); text-align: center; line-height: 1.5; }

/* Phone. The card is already `width: 100%; max-width: 380px`, so the layout
   needs nothing — but the inputs do. iOS zooms the viewport whenever a focused
   field's text is under 16px and does not zoom back out, and this is the one
   page where that lands on a password field: the form scales up, shifts
   sideways, and the Sign in button is off screen by the time you have finished
   typing. Same floor as index.html's phone block. */
@media (max-width: 640px) {
  body   { padding: 16px; align-items: flex-start; padding-top: 8vh; }
  .card  { padding: 28px 20px 24px; }
  input  { font-size: 16px; padding: 12px 13px; }
  button { font-size: 15px; padding: 14px; }
}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="logo-mark"></div>
    <div>
      <div class="title">McKechnie Terminal</div>
      <div class="subtitle">Sign in</div>
    </div>
  </div>

  <div class="error" id="error"></div>

  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username"
             autocapitalize="none" spellcheck="false" autofocus required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required />
    </div>
    <button type="submit" id="submitBtn">Sign in</button>
  </form>
{%- if guest_enabled %}

  <div class="or">or</div>
  <button type="button" class="guest" id="guestBtn">Continue as guest</button>
  <div class="guest-note">A read-only tour with a sample portfolio. Nothing you do is saved.</div>
{%- endif %}

  <div class="foot">Accounts are created by an administrator.</div>
</div>

<script>
// The server has already reduced ?next= to a path inside this app; this is the
// same check again, because the value reaches location.href here.
const RAW_NEXT = {{ next_url | tojson }};
const NEXT = (typeof RAW_NEXT === 'string'
              && RAW_NEXT.startsWith('/')
              && !RAW_NEXT.startsWith('//')
              && !RAW_NEXT.includes('\\')) ? RAW_NEXT : '/';

const form   = document.getElementById('loginForm');
const errBox = document.getElementById('error');
const btn    = document.getElementById('submitBtn');

function showError(msg) {
  errBox.textContent = msg;          // textContent, never innerHTML
  errBox.style.display = 'block';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      location.href = NEXT;
      return;
    }
    showError(data.error || 'Sign in failed.');
  } catch (err) {
    showError('Could not reach the server.');
  }

  document.getElementById('password').value = '';
  btn.disabled = false;
  btn.textContent = 'Sign in';
});

// Same shape as the form above: one POST, then the same redirect. The button
// is absent from the document when the server rendered no guest, so the
// listener is guarded rather than the element assumed.
const guestBtn = document.getElementById('guestBtn');
if (guestBtn) guestBtn.addEventListener('click', async () => {
  errBox.style.display = 'none';
  guestBtn.disabled = true;
  guestBtn.textContent = 'Opening...';
  try {
    const res = await fetch('/api/auth/guest', {
      method: 'POST',
      credentials: 'same-origin',
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      location.href = NEXT;
      return;
    }
    showError(data.error || 'Guest access is unavailable.');
  } catch (err) {
    showError('Could not reach the server.');
  }
  guestBtn.disabled = false;
  guestBtn.textContent = 'Continue as guest';
});
</script>

</body>
</html>
